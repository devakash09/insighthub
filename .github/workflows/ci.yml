name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://insighthub:insighthub@localhost:5432/insighthub?schema=public
  AUTH_SECRET: ci-only-secret
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insighthub
          POSTGRES_PASSWORD: insighthub
          POSTGRES_DB: insighthub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insighthub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: insighthub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
